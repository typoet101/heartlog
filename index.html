<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Heart Log | 심장 기록</title>

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="심장기록">
    <meta name="theme-color" content="#FFF5F2">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        :root {
            --bg: #FFF5F2;
            --bg-sub: #FFEEE8;
            --primary: #FF6B6B;
            --primary-light: #FF9A9A;
            --primary-dark: #E85555;
            --primary-glow: rgba(255, 107, 107, 0.25);
            --primary-soft: rgba(255, 107, 107, 0.08);
            --card: rgba(255, 255, 255, 0.75);
            --card-solid: #FFFFFF;
            --glass: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.8);
            --success: #FF9A9A;
            --text: #2D2424;
            --text-sub: #B09A94;
            --border: rgba(0,0,0,0.05);
            --sev1: #FFD4CC;
            --sev2: #FFE066;
            --sev3: #FFB5A7;
            --sev4: #E8A0BF;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.08);
            --shadow-glow: 0 8px 32px rgba(255,107,107,0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
        }

        /* 배경 그라데이션 오브 */
        body::before {
            content: '';
            position: fixed;
            top: -120px;
            right: -80px;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,107,107,0.12) 0%, rgba(255,107,107,0.03) 60%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: 60px;
            left: -100px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,154,154,0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        @keyframes pulseGlow {
            0%   { box-shadow: 0 0 0 0 rgba(255,107,107,0.3), var(--shadow-glow); }
            50%  { box-shadow: 0 0 0 20px rgba(255,107,107,0), var(--shadow-glow); }
            100% { box-shadow: 0 0 0 0 rgba(255,107,107,0.3), var(--shadow-glow); }
        }

        @keyframes pulseRing {
            0%   { transform: scale(0.85); opacity: 0.6; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }

        @keyframes chipPop {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes barGrow {
            from { height: 0; }
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to   { opacity: 1; transform: translate(-50%, 0); }
        }

        @keyframes heartBeat {
            0%   { transform: scale(1); }
            15%  { transform: scale(1.15); }
            30%  { transform: scale(1); }
            45%  { transform: scale(1.1); }
            60%  { transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        button:focus-visible { outline: 3px solid var(--primary-light); outline-offset: 2px; }
        input:focus-visible, textarea:focus-visible { outline: 3px solid var(--primary-light); outline-offset: 2px; }

        /* 글래스 카드 */
        .glass-card {
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ═══════════════════════════════════════
        // 상수
        // ═══════════════════════════════════════
        const SYMPTOMS = [
            { key: 'palpitation', label: '두근거림',  icon: '💓' },
            { key: 'chest_tight', label: '가슴 답답', icon: '😤' },
            { key: 'dizzy',       label: '어지러움',  icon: '😵‍💫' },
            { key: 'breathless',  label: '숨이 참',   icon: '😮‍💨' },
            { key: 'chest_pain',  label: '가슴 통증', icon: '😖' },
            { key: 'other',       label: '기타',      icon: '📝' }
        ];

        const SEVERITIES = [
            { value: 1, emoji: '😊', label: '괜찮아',     color: 'var(--sev1)' },
            { value: 2, emoji: '😐', label: '좀 불편해',   color: 'var(--sev2)' },
            { value: 3, emoji: '😣', label: '힘들어',     color: 'var(--sev3)' },
            { value: 4, emoji: '😰', label: '많이 힘들어', color: 'var(--sev4)' }
        ];

        const ACTIVITIES = [
            { key: 'rest',     label: '가만히 있음', icon: '🧘' },
            { key: 'walking',  label: '걷는 중',    icon: '🚶' },
            { key: 'running',  label: '뛰는 중',    icon: '🏃' },
            { key: 'exercise', label: '운동 중',    icon: '⚽' },
            { key: 'sleeping', label: '잠자는 중',  icon: '😴' },
            { key: 'class',    label: '수업 중',    icon: '📚' }
        ];

        const DAYS_KO = ['일', '월', '화', '수', '목', '금', '토'];
        const STORAGE_KEY = 'heartlog_records';

        // ═══════════════════════════════════════
        // Supabase
        // ═══════════════════════════════════════
        const SUPABASE_URL = 'https://przhswxicchuozkuitmz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByemhzd3hpY2NodW96a3VpdG16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMTU5NzMsImV4cCI6MjA5MTc5MTk3M30.0pHJojAq-ktx_PvpNsQgSkpqKOstpNbIgr6MAPwYxI0';
        const _supabaseReady = SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY';
        const sb = _supabaseReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        // ═══════════════════════════════════════
        // 데이터 레이어
        // ═══════════════════════════════════════
        function loadRecordsLocal() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return [];
                return JSON.parse(raw).records || [];
            } catch { return []; }
        }

        function saveRecordsLocal(records) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 2, records }));
        }

        function recordToRow(record, userId) {
            return {
                id: record.id, user_id: userId, timestamp: record.timestamp,
                symptoms: record.symptoms, severity: record.severity,
                activity: record.activity, duration_seconds: record.durationSeconds,
                memo: record.memo || ''
            };
        }

        function rowToRecord(row) {
            return {
                id: row.id, timestamp: row.timestamp, symptoms: row.symptoms,
                severity: row.severity, activity: row.activity,
                durationSeconds: row.duration_seconds, memo: row.memo || ''
            };
        }

        async function fetchRecordsFromSupabase() {
            if (!sb) return [];
            const { data, error } = await sb.from('records').select('*').order('timestamp', { ascending: false });
            if (error) { console.warn('Supabase fetch error:', error); return []; }
            return (data || []).map(rowToRecord);
        }

        async function upsertRecordToSupabase(userId, record) {
            if (!sb) return;
            const { error } = await sb.from('records').upsert(recordToRow(record, userId));
            if (error) console.warn('Supabase upsert error:', error);
        }

        async function deleteRecordFromSupabase(recordId) {
            if (!sb) return;
            const { error } = await sb.from('records').delete().eq('id', recordId);
            if (error) console.warn('Supabase delete error:', error);
        }

        async function syncAllToSupabase(userId, localRecords) {
            if (!sb || localRecords.length === 0) return;
            const rows = localRecords.map(r => recordToRow(r, userId));
            const { error } = await sb.from('records').upsert(rows);
            if (error) console.warn('Supabase bulk sync error:', error);
        }

        // ═══════════════════════════════════════
        // Google Sheets 동기화
        // ═══════════════════════════════════════
        const SHEET_URL_KEY = 'heartlog_sheet_url';
        function getSheetUrl() { return localStorage.getItem(SHEET_URL_KEY) || ''; }
        function setSheetUrl(url) { localStorage.setItem(SHEET_URL_KEY, url); }

        async function syncToSheet(record) {
            const url = getSheetUrl();
            if (!url) return { ok: false, reason: 'no_url' };
            try {
                const sevInfo = getSeverityInfo(record.severity);
                await fetch(url, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'add', timestamp: record.timestamp,
                        date: new Date(record.timestamp).toLocaleDateString('ko-KR'),
                        time: formatTime(record.timestamp),
                        symptoms: record.symptoms.map(getSymptomLabel).join(', '),
                        severity: sevInfo ? `${sevInfo.emoji} ${sevInfo.label}` : '',
                        activity: getActivityLabel(record.activity),
                        duration: record.durationSeconds ? formatDuration(record.durationSeconds) : '',
                        memo: record.memo || ''
                    })
                });
                return { ok: true };
            } catch (e) { return { ok: false, reason: 'network' }; }
        }

        async function syncDeleteToSheet(recordId) {
            const url = getSheetUrl();
            if (!url) return;
            try {
                await fetch(url, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete', id: recordId })
                });
            } catch (e) {}
        }

        // ═══════════════════════════════════════
        // 유틸
        // ═══════════════════════════════════════
        function formatDate(d) {
            const date = new Date(d);
            return `${date.getMonth() + 1}월 ${date.getDate()}일 ${DAYS_KO[date.getDay()]}요일`;
        }
        function formatTime(d) {
            const date = new Date(d);
            return `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
        }
        function formatDateShort(d) {
            const date = new Date(d);
            return `${date.getMonth() + 1}월 ${date.getDate()}일 (${DAYS_KO[date.getDay()]})`;
        }
        function formatDuration(sec) {
            if (!sec) return null;
            const m = Math.floor(sec / 60), s = sec % 60;
            return m > 0 ? `${m}분 ${s}초` : `${s}초`;
        }
        function isSameDay(d1, d2) {
            const a = new Date(d1), b = new Date(d2);
            return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
        }
        function getSymptomLabel(key) { return SYMPTOMS.find(s => s.key === key)?.label || key; }
        function getActivityLabel(key) { return ACTIVITIES.find(a => a.key === key)?.label || key; }
        function getSeverityInfo(val) { return SEVERITIES.find(s => s.value === val); }
        function vibrate() { if (navigator.vibrate) navigator.vibrate(50); }

        // ═══════════════════════════════════════
        // 토스트
        // ═══════════════════════════════════════
        function Toast({ message, show }) {
            if (!show) return null;
            return (
                <div style={{
                    position: 'fixed', top: 60, left: '50%',
                    transform: 'translateX(-50%)',
                    background: 'rgba(109,212,184,0.95)',
                    backdropFilter: 'blur(12px)',
                    color: '#fff', padding: '14px 32px',
                    borderRadius: 20, fontSize: 15, fontWeight: 700, zIndex: 200,
                    animation: 'toastIn 0.3s ease',
                    boxShadow: '0 8px 32px rgba(109,212,184,0.3)'
                }}>
                    {message}
                </div>
            );
        }

        // ═══════════════════════════════════════
        // 탭바 (입체감 있는 하단바)
        // ═══════════════════════════════════════
        function TabBar({ activeTab, onTabChange }) {
            const tabs = [
                { key: 'home', label: '홈', iconActive: (
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M3 10.5L12 3L21 10.5V20C21 20.5 20.5 21 20 21H15V15H9V21H4C3.5 21 3 20.5 3 20V10.5Z" fill="var(--primary)" stroke="var(--primary)" strokeWidth="1.5" strokeLinejoin="round"/>
                    </svg>
                ), iconInactive: (
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M3 10.5L12 3L21 10.5V20C21 20.5 20.5 21 20 21H15V15H9V21H4C3.5 21 3 20.5 3 20V10.5Z" stroke="var(--text-sub)" strokeWidth="1.5" strokeLinejoin="round"/>
                    </svg>
                )},
                { key: 'history', label: '기록', iconActive: (
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="9" stroke="var(--primary)" strokeWidth="1.5"/>
                        <path d="M12 7V12L15 15" stroke="var(--primary)" strokeWidth="1.5" strokeLinecap="round"/>
                    </svg>
                ), iconInactive: (
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="9" stroke="var(--text-sub)" strokeWidth="1.5"/>
                        <path d="M12 7V12L15 15" stroke="var(--text-sub)" strokeWidth="1.5" strokeLinecap="round"/>
                    </svg>
                )},
                { key: 'stats', label: '통계', iconActive: (
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="4" y="13" width="4" height="7" rx="1" fill="var(--primary)"/>
                        <rect x="10" y="8" width="4" height="12" rx="1" fill="var(--primary)"/>
                        <rect x="16" y="4" width="4" height="16" rx="1" fill="var(--primary)"/>
                    </svg>
                ), iconInactive: (
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="4" y="13" width="4" height="7" rx="1" stroke="var(--text-sub)" strokeWidth="1.5"/>
                        <rect x="10" y="8" width="4" height="12" rx="1" stroke="var(--text-sub)" strokeWidth="1.5"/>
                        <rect x="16" y="4" width="4" height="16" rx="1" stroke="var(--text-sub)" strokeWidth="1.5"/>
                    </svg>
                )},
                { key: 'settings', label: '설정', iconActive: (
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="3" fill="var(--primary)"/>
                        <path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" stroke="var(--primary)" strokeWidth="1.5" strokeLinecap="round"/>
                    </svg>
                ), iconInactive: (
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="3" stroke="var(--text-sub)" strokeWidth="1.5"/>
                        <path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" stroke="var(--text-sub)" strokeWidth="1.5" strokeLinecap="round"/>
                    </svg>
                )}
            ];
            return (
                <nav style={{
                    position: 'fixed', bottom: 0, left: 0, right: 0,
                    background: 'rgba(255,255,255,0.85)',
                    backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)',
                    borderTop: '1px solid rgba(0,0,0,0.04)',
                    display: 'flex', height: 72,
                    paddingBottom: 'env(safe-area-inset-bottom)',
                    zIndex: 50
                }}>
                    {tabs.map(t => (
                        <button key={t.key} onClick={() => onTabChange(t.key)} style={{
                            flex: 1, display: 'flex', flexDirection: 'column',
                            alignItems: 'center', justifyContent: 'center', gap: 4,
                            position: 'relative'
                        }}>
                            {activeTab === t.key && (
                                <div style={{
                                    position: 'absolute', top: -1, left: '50%', transform: 'translateX(-50%)',
                                    width: 24, height: 3, borderRadius: 2,
                                    background: 'var(--primary)'
                                }} />
                            )}
                            <div style={{
                                width: 44, height: 44, borderRadius: 16,
                                display: 'flex', alignItems: 'center', justifyContent: 'center',
                                background: activeTab === t.key ? 'var(--primary-soft)' : 'transparent',
                                transition: 'all 0.25s ease'
                            }}>
                                {activeTab === t.key ? t.iconActive : t.iconInactive}
                            </div>
                            <span style={{
                                fontSize: 10, fontWeight: activeTab === t.key ? 800 : 500,
                                color: activeTab === t.key ? 'var(--primary)' : 'var(--text-sub)',
                                transition: 'all 0.2s'
                            }}>{t.label}</span>
                        </button>
                    ))}
                </nav>
            );
        }

        // ═══════════════════════════════════════
        // 메인 화면 (버튼 = 타이머 통합)
        // ═══════════════════════════════════════
        function MainScreen({ todayCount, onButtonPress, timerRunning, timerElapsed }) {
            const now = new Date();
            const timerDisplay = useCallback(() => {
                const totalSec = Math.floor(timerElapsed / 1000);
                const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
                const s = String(totalSec % 60).padStart(2, '0');
                return `${m}:${s}`;
            }, [timerElapsed]);

            return (
                <div style={{
                    minHeight: '100vh', minHeight: '100dvh',
                    display: 'flex', flexDirection: 'column', alignItems: 'center',
                    paddingTop: 'max(60px, env(safe-area-inset-top, 60px))',
                    paddingBottom: 120,
                    animation: 'fadeIn 0.5s ease',
                    position: 'relative', zIndex: 1
                }}>
                    {/* 날짜 & 카운트 */}
                    <div style={{ textAlign: 'left', width: '100%', padding: '0 28px', marginBottom: 48 }}>
                        <p style={{ fontSize: 15, color: 'var(--text-sub)', fontWeight: 500, letterSpacing: '-0.3px' }}>
                            {formatDate(now)}
                        </p>
                        <h1 style={{ fontSize: 28, fontWeight: 800, color: 'var(--text)', marginTop: 6, lineHeight: 1.3 }}>
                            오늘 하루,
                        </h1>
                        <h1 style={{ fontSize: 28, fontWeight: 800, color: 'var(--primary)', lineHeight: 1.3 }}>
                            심장 기록 {todayCount}건
                        </h1>
                    </div>

                    {/* 3D 버튼 = 타이머 통합 */}
                    <div style={{
                        position: 'relative',
                        width: 260, height: 260,
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        marginBottom: 24
                    }}>
                        {/* 외부 글로우 링 1 */}
                        <div style={{
                            position: 'absolute', inset: 0,
                            borderRadius: '50%',
                            background: timerRunning
                                ? 'radial-gradient(circle, rgba(255,107,107,0.15) 40%, transparent 70%)'
                                : 'radial-gradient(circle, rgba(255,107,107,0.08) 40%, transparent 70%)',
                            animation: timerRunning ? 'pulse 1.5s ease-in-out infinite' : 'pulse 3s ease-in-out infinite'
                        }} />
                        {/* 외부 글로우 링 2 */}
                        <div style={{
                            position: 'absolute',
                            width: 220, height: 220,
                            left: 20, top: 20,
                            borderRadius: '50%',
                            background: timerRunning
                                ? 'radial-gradient(circle, rgba(255,107,107,0.2) 30%, transparent 70%)'
                                : 'radial-gradient(circle, rgba(255,107,107,0.12) 30%, transparent 70%)',
                            animation: timerRunning ? 'pulse 1.5s ease-in-out 0.3s infinite' : 'pulse 3s ease-in-out 0.5s infinite'
                        }} />
                        {/* 메인 버튼 (대기 = 누르세요 / 측정중 = 타이머) */}
                        <button
                            onClick={() => { vibrate(); onButtonPress(); }}
                            style={{
                                width: 180, height: 180, borderRadius: '50%',
                                background: timerRunning
                                    ? 'radial-gradient(circle at 35% 30%, #FF7A7A 0%, #E85555 50%, #D04040 100%)'
                                    : 'radial-gradient(circle at 35% 30%, #FF9A9A 0%, #FF6B6B 50%, #E85555 100%)',
                                color: '#fff', display: 'flex', flexDirection: 'column',
                                alignItems: 'center', justifyContent: 'center', gap: 6,
                                border: 'none',

        function SymptomRecordPanel({ isOpen, onClose, onSave, timerElapsed }) {
            const [activity, setActivity] = useState(null);
            const [memo, setMemo] = useState('');
            const [timestamp] = useState(() => new Date().toISOString());
            const [saving, setSaving] = useState(false);
            const isManual = !timerElapsed;
            const [manualDate, setManualDate] = useState('');
            const [manualTime, setManualTime] = useState('');

            useEffect(() => {
                if (isOpen) {
                    setActivity(null); setMemo(''); setSaving(false);
                    const now = new Date();
                    setManualDate(now.toISOString().slice(0, 10));
                    setManualTime(`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`);
                    setManualDurationMin('');

            const handleSave = () => {
                setSaving(true); vibrate();
                const finalTimestamp = isManual
                    ? new Date(`${manualDate}T${manualTime}:00`).toISOString()
                    : timestamp;
                const finalDuration = isManual
                    ? (manualDurationMin ? parseInt(manualDurationMin) * 60 : null)

                setTimeout(() => {

                        id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2),

            const groups = {};
            filtered.forEach(r => { const k = new Date(r.timestamp).toDateString(); if (!groups[k]) groups[k] = []; groups[k].push(r); });

        // ═══════════════════════════════════════
        // 통계
        // ═══════════════════════════════════════
        function StatsScreen({ records }) {
            const [period, setPeriod] = useState('week');
            const [copied, setCopied] = useState(false);
            const now = new Date();

            const getStartDate = () => {
                const d = new Date(now);
                if (period === 'week') { const day = d.getDay(); d.setDate(d.getDate() - (day === 0 ? 6 : day - 1)); }
                else d.setDate(1);
                d.setHours(0, 0, 0, 0); return d;
            };

            const startDate = getStartDate();
            const filtered = records.filter(r => new Date(r.timestamp) >= startDate);

            const dailyCounts = (() => {
                if (period === 'week') {
                    const counts = [0,0,0,0,0,0,0];
                    filtered.forEach(r => { let di = new Date(r.timestamp).getDay() - 1; if (di < 0) di = 6; counts[di]++; });
                    return counts;
                } else {
                    const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                    const weeks = Math.ceil(dim / 7); const counts = new Array(weeks).fill(0);
                    filtered.forEach(r => { const wi = Math.floor((new Date(r.timestamp).getDate() - 1) / 7); if (wi < counts.length) counts[wi]++; });
                    return counts;
                }
            })();
            const maxCount = Math.max(...dailyCounts, 1);

            const symptomCounts = {};
            filtered.forEach(r => r.symptoms.forEach(s => { symptomCounts[s] = (symptomCounts[s] || 0) + 1; }));
            const symptomRanking = Object.entries(symptomCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const activityCounts = {};
            filtered.forEach(r => { activityCounts[r.activity] = (activityCounts[r.activity] || 0) + 1; });
            const activityRanking = Object.entries(activityCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const maxSymptomCount = symptomRanking.length > 0 ? symptomRanking[0][1] : 1;

            const handleExport = () => {
                const lines = ['=== 심장 기록 (Heart Log) ==='];
                const sortedAll = [...records].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                if (sortedAll.length === 0) lines.push('기록이 없습니다.');
                else {
                    lines.push(`기간: ${new Date(sortedAll[sortedAll.length-1].timestamp).toLocaleDateString('ko-KR')} ~ ${new Date(sortedAll[0].timestamp).toLocaleDateString('ko-KR')}`);
                    lines.push(`총 기록: ${sortedAll.length}건\n`);
                    sortedAll.forEach(r => {
                        const si = getSeverityInfo(r.severity);
                        lines.push('---');
                        lines.push(`${formatDateShort(r.timestamp)} ${formatTime(r.timestamp)}`);
                        lines.push(`증상: ${r.symptoms.map(getSymptomLabel).join(', ')}`);
                        if (si) lines.push(`힘든 정도: ${si.emoji} ${si.label}`);
                        lines.push(`상황: ${getActivityLabel(r.activity)}`);
                        if (r.durationSeconds) lines.push(`지속시간: ${formatDuration(r.durationSeconds)}`);
                        if (r.memo) lines.push(`메모: ${r.memo}`);
                        lines.push('');
                    });
                }
                const text = lines.join('\n');
                navigator.clipboard.writeText(text).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); })
                .catch(() => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); setCopied(true); setTimeout(() => setCopied(false), 2000); });
            };

            const barLabels = period === 'week' ? ['월','화','수','목','금','토','일'] : dailyCounts.map((_,i) => `${i+1}주`);

            const handleExportBackup = () => {
                const data = JSON.stringify({ version: 2, records, exportedAt: new Date().toISOString() }, null, 2);

                const a = document.createElement('a'); a.href = url; a.download = `heartlog-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();

                    reader.onload = (ev) => {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (data.records && Array.isArray(data.records)) {
                                localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 2, records: data.records }));
                                alert(`${data.records.length}건의 기록을 불러왔어요! 새로고침합니다.`);

                    </div>

                    <div className="glass-card" style={{ padding: 20, marginBottom: 16 }}>
                        <button onClick={() => setShowGuide(!showGuide)} style={{ width: '100%', textAlign: 'left', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <h3 style={{ fontSize: 16, fontWeight: 800 }}>📖 구글 시트 설정 방법</h3>
                            <span style={{ fontSize: 16, color: 'var(--text-sub)' }}>{showGuide ? '▲' : '▼'}</span>

                            <div style={{ marginTop: 14, fontSize: 14, lineHeight: 1.8, color: 'var(--text)' }}>

                                <p><strong>2.</strong> 메뉴 → 확장 프로그램 → Apps Script</p>
                                <p><strong>3.</strong> 코드 전체 지우고 아래 코드 붙여넣기:</p>
                                <div style={{ background: 'var(--bg-sub)', borderRadius: 14, padding: 14, margin: '8px 0', fontSize: 11, fontFamily: 'monospace', overflowX: 'auto', whiteSpace: 'pre-wrap', wordBreak: 'break-all' }}>
{`function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var data = JSON.parse(e.postData.contents);
  if (data.action === 'test') {
    sheet.appendRow(['테스트', new Date(), '연결 성공!']);
    return ContentService.createTextOutput('ok');
  }
  if (data.action === 'add') {
    sheet.appendRow([data.date, data.time, data.symptoms,
      data.severity, data.activity, data.duration,
      data.memo, data.timestamp]);
  }
  return ContentService.createTextOutput('ok');
}
function doGet(e) {
  return ContentService.createTextOutput('Heart Log API');
}`}
                                </div>
                                <p><strong>4.</strong> 배포 → 새 배포 → 유형: 웹 앱</p>
                                <p><strong>5.</strong> 액세스 권한: "모든 사용자" 선택</p>
                                <p><strong>6.</strong> 배포 → URL 복사 → 위 입력칸에 붙여넣기</p>
                            </div>
                        )}
                    </div>

                    <div className="glass-card" style={{ padding: 20, marginBottom: 16 }}>
                        <h3 style={{ fontSize: 16, fontWeight: 800, marginBottom: 14 }}>💾 백업 / 복원</h3>
                        <p style={{ fontSize: 13, color: 'var(--text-sub)', marginBottom: 14, lineHeight: 1.5 }}>기록을 파일로 내보내거나, 파일에서 불러올 수 있어요.</p>
                        <div style={{ display: 'flex', gap: 8 }}>
                            <button onClick={handleExportBackup} style={{ flex: 1, padding: '14px', borderRadius: 16, background: 'rgba(0,0,0,0.04)', color: 'var(--primary)', fontSize: 14, fontWeight: 700 }}>📤 내보내기</button>
                            <button onClick={handleImportBackup} style={{ flex: 1, padding: '14px', borderRadius: 16, background: 'rgba(0,0,0,0.04)', color: 'var(--primary)', fontSize: 14, fontWeight: 700 }}>📥 불러오기</button>
                        </div>
                    </div>

                    {session && (
                        <div className="glass-card" style={{ padding: 20, marginBottom: 16 }}>
                            <h3 style={{ fontSize: 16, fontWeight: 800, marginBottom: 10 }}>👤 계정</h3>
                            <p style={{ fontSize: 14, color: 'var(--text-sub)', marginBottom: 14 }}>{session.user.email}</p>
                            <button onClick={onSignOut}
                                style={{ width: '100%', padding: '14px', borderRadius: 16, background: 'rgba(0,0,0,0.04)', color: '#e74c3c', fontSize: 14, fontWeight: 700 }}>
                                로그아웃
                            </button>
                        </div>
                    )}

                    <div className="glass-card" style={{ padding: 20, textAlign: 'center' }}>
                        <p style={{ fontSize: 14, color: 'var(--text-sub)' }}>Heart Log v3.0</p>
                        <p style={{ fontSize: 13, color: 'var(--text-sub)', marginTop: 4 }}>총 기록: {records.length}건</p>
                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════
        // 로그인 화면

        function AuthScreen({ onAuth }) {
            const [isSignUp, setIsSignUp] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async () => {
                setError(''); setLoading(true);
                try {
                    const { data, error: authError } = isSignUp
                        ? await sb.auth.signUp({ email, password })
                        : await sb.auth.signInWithPassword({ email, password });
                    if (authError) {
                        if (authError.message.includes('Invalid login')) setError('이메일 또는 비밀번호가 맞지 않아요');
                        else if (authError.message.includes('already registered')) setError('이미 가입된 이메일이에요');
                        else if (authError.message.includes('valid email')) setError('올바른 이메일을 입력해주세요');
                        else if (authError.message.includes('at least')) setError('비밀번호는 6자 이상이어야 해요');
                        else setError(authError.message);
                    }
                } catch (e) { setError('연결에 실패했어요. 인터넷을 확인해주세요'); }
                setLoading(false);
            };

            const inputStyle = {
                width: '100%', padding: '16px 18px', borderRadius: 16,
                border: '2px solid rgba(0,0,0,0.06)', fontSize: 15,
                fontFamily: 'inherit', background: 'rgba(255,255,255,0.9)',
                color: 'var(--text)', outline: 'none'
            };

            return (
                <div style={{ minHeight: '100dvh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '40px 24px', position: 'relative', zIndex: 1 }}>
                    <div style={{ textAlign: 'center', marginBottom: 40 }}>
                        <div style={{ fontSize: 56, marginBottom: 12, animation: 'heartBeat 1.2s ease-in-out infinite' }}>💓</div>
                        <h1 style={{ fontSize: 28, fontWeight: 800, color: 'var(--text)', marginBottom: 6 }}>심장 기록</h1>
                        <p style={{ fontSize: 15, color: 'var(--text-sub)' }}>Heart Log</p>
                    </div>

                    <div className="glass-card" style={{ padding: 28, width: '100%', maxWidth: 380 }}>
                        <h2 style={{ fontSize: 20, fontWeight: 800, marginBottom: 20, textAlign: 'center' }}>
                            {isSignUp ? '가입하기' : '로그인'}
                        </h2>

                        <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 16 }}>
                            <input type="email" value={email} onChange={e => setEmail(e.target.value)}

                                onKeyDown={e => e.key === 'Enter' && handleSubmit()} />
                            <input type="password" value={password} onChange={e => setPassword(e.target.value)}

                                onKeyDown={e => e.key === 'Enter' && handleSubmit()} />

                                style={{ color: 'var(--primary)', fontWeight: 700, cursor: 'pointer' }}>

        // ═══════════════════════════════════════
        // App
        // ═══════════════════════════════════════
        function App() {
            const [session, setSession] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('home');
            const [isRecording, setIsRecording] = useState(false);
            const [records, setRecords] = useState(() => loadRecordsLocal());
            const [toast, setToast] = useState({ show: false, message: '' });
            const [timerRunning, setTimerRunning] = useState(false);
            const [timerStart, setTimerStart] = useState(null);
            const [timerElapsed, setTimerElapsed] = useState(0);
            const timerRef = useRef(null);

            // 인증 상태 감지
            useEffect(() => {
                if (!sb) { setAuthLoading(false); return; }
                sb.auth.getSession().then(({ data }) => {
                    setSession(data.session);
                    setAuthLoading(false);
                });
                const { data: { subscription } } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
                return () => subscription.unsubscribe();
            }, []);

            // 로그인 시 데이터 동기화
            useEffect(() => {
                if (!session) return;
                const userId = session.user.id;
                (async () => {
                    try {
                        const localRecs = loadRecordsLocal();
                        const remoteRecs = await fetchRecordsFromSupabase();

                        if (localRecs.length === 0 && remoteRecs.length > 0) {
                            setRecords(remoteRecs);
                            saveRecordsLocal(remoteRecs);
                            return;
                        }

                        if (localRecs.length > 0) {
                            const remoteIds = new Set(remoteRecs.map(r => r.id));
                            const localOnly = localRecs.filter(r => !remoteIds.has(r.id));
                            if (localOnly.length > 0) await syncAllToSupabase(userId, localOnly);
                        }

                        const allIds = new Set();
                        const merged = [];
                        for (const r of [...remoteRecs, ...localRecs]) {
                            if (!allIds.has(r.id)) { allIds.add(r.id); merged.push(r); }
                        }
                        merged.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                        setRecords(merged);
                        saveRecordsLocal(merged);
                    } catch (e) { console.warn('Sync on login failed:', e); }
                })();
            }, [session]);

            useEffect(() => {
                if (timerRunning && timerStart) {
                    timerRef.current = setInterval(() => setTimerElapsed(Date.now() - timerStart), 200);
                    return () => clearInterval(timerRef.current);
                }
            }, [timerRunning, timerStart]);

            useEffect(() => { saveRecordsLocal(records); }, [records]);

            const todayCount = records.filter(r => isSameDay(r.timestamp, new Date())).length;

            const handleSave = async (newRecord) => {
                setRecords(prev => [newRecord, ...prev]);
                setIsRecording(false);
                if (timerRunning) { setTimerRunning(false); clearInterval(timerRef.current); }
                setTimerElapsed(0); setTimerStart(null);

                if (session) {
                    upsertRecordToSupabase(session.user.id, newRecord).catch(() => {});
                }
                const syncResult = await syncToSheet(newRecord);
                setToast({ show: true, message: syncResult.ok ? '저장했어요! 💓 (☁️ 동기화 완료)' : '저장했어요! 💓' });
                setTimeout(() => setToast({ show: false, message: '' }), 2500);
            };

            const handleDelete = (id) => {
                setRecords(prev => prev.filter(r => r.id !== id));
                if (session) {
                    deleteRecordFromSupabase(id).catch(() => {});
                }
                syncDeleteToSheet(id);
                setToast({ show: true, message: '삭제했어요' });
                setTimeout(() => setToast({ show: false, message: '' }), 2000);
            };

            const handleButtonPress = () => {
                if (!timerRunning) {
                    setTimerStart(Date.now());
                    setTimerRunning(true);
                    setTimerElapsed(0);
                } else {
                    setTimerRunning(false);
                    clearInterval(timerRef.current);
                    setIsRecording(true);
                }
            };

            const handleSignOut = async () => {
                await sb.auth.signOut();
                setSession(null);
                setActiveTab('home');
            };

            if (authLoading) {
                return (
                    <div style={{ minHeight: '100dvh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: 48, animation: 'heartBeat 1.2s ease-in-out infinite' }}>💓</div>
                            <p style={{ marginTop: 16, color: 'var(--text-sub)', fontSize: 15, fontWeight: 600 }}>로딩 중...</p>
                        </div>
                    </div>
                );
            }

            if (sb && !session) return <AuthScreen onAuth={setSession} />;

            return (
                <div>
                    <Toast message={toast.message} show={toast.show} />
                    {activeTab === 'home' && <MainScreen todayCount={todayCount} onButtonPress={handleButtonPress} timerRunning={timerRunning} timerElapsed={timerElapsed} />}
                    {activeTab === 'history' && <RecordScreen records={records} onDeleteRecord={handleDelete} onManualRecord={() => setIsRecording(true)} />}
                    {activeTab === 'stats' && <StatsScreen records={records} />}
                    {activeTab === 'settings' && <SettingsScreen records={records} session={session} onSignOut={handleSignOut} />}
                    <SymptomRecordPanel isOpen={isRecording} onClose={() => setIsRecording(false)} onSave={handleSave} timerElapsed={timerElapsed > 0 ? timerElapsed : null} />
                    <TabBar activeTab={activeTab} onTabChange={setActiveTab} />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(() => {
                if (navigator.storage && navigator.storage.persist) {
                    navigator.storage.persist();
                }
            });
        }
    </script>
</body>
</html>
